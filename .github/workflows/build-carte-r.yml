name: Build and Push carte-r Docker Image

on:
  push:
    branches:
      - master
    paths:
      - 'carte-r/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: carte-r/assets
          file: carte-r/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carte-r:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carte-r:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_VERSION=${{ github.sha }}

  build-and-push-rstudio:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push static RStudio image
        uses: docker/build-push-action@v6
        with:
          context: carte-r
          file: carte-r/Dockerfile.rstudio
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carte-r-rstudio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carte-r-rstudio:${{ github.sha }}
