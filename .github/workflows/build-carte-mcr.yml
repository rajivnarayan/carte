name: Build and Push carte-mcr Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'carte-mcr/**'
  workflow_dispatch:

jobs:
  build-and-push-v95:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push carte-mcr-v95
        uses: docker/build-push-action@v6
        with:
          context: carte-mcr/v95
          file: carte-mcr/v95/Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carte-mcr-v95:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carte-mcr-v95:${{ github.sha }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_VERSION=${{ github.sha }}
